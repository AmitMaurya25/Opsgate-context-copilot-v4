services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  opsgate-api:
    build: .
    command: uvicorn api.server:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      MEM0_VECTOR_STORE: qdrant
      QDRANT_HOST: qdrant
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./logs:/app/logs", "./mcp_servers.json:/app/mcp_servers.json"]
    depends_on: [qdrant]

  opsgate-ui:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      OPSGATE_API_URL: http://opsgate-api:8000
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    depends_on: [opsgate-api]
